{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
        <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
        <link rel="icon" href="{% static 'images/logo.jpeg' %}">
        <link rel="stylesheet" href="{% static 'css/master.css' %}">

        {% block title%}
            <title>Eventify</title>
        {% endblock %}  

        {% block extra_css%}
        {% endblock %}
    </head>
    <body>
        <div class="d-flex align-items-center justify-content-between emergency-details">
            <span class="ms-5 ps-4 pt-1">
               <p class="d-flex align-items-center">
                    <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                        fill="currentColor" viewBox="0 0 24 24"  class="pe-1">
                        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                        <path d="M7 19H4v2h16v-2h-3v-6c0-2.76-2.24-5-5-5s-5 2.24-5 5zm2-6c0-1.65 1.35-3 3-3s3 1.35 3 3v6H9zm4-7V3h-2v3zm6 5v2h3v-2zM5 13v-2H2v2zm12.66-5.24 1.06-1.06 1.06-1.06-.71-.71-.71-.71-1.06 1.06-1.06 1.06.71.71zm-11.32 0 .71-.71.71-.71L6.7 5.28 5.64 4.22l-.71.71-.71.71L5.28 6.7z"></path>
                    </svg>
                    Emergency: Call 0746090609
               </p>
            </span>
            <span class="me-5 pe-4 pt-1">
               <p class="d-flex align-items-center">
                    <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                        fill="currentColor" viewBox="0 0 24 24" class="pe-1" >
                        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                        <path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8"></path><path d="M13 6h-2v6c0 .18.05.35.13.5l3 5.2 1.73-1-2.87-4.96V6.01Z"></path>
                    </svg>
                    Emergency department open 24/7
               </p>
            </span>
        </div>
        <nav class="navbar navbar-expand-lg sticky-top navigation-section">
            <div class="container">
                <a class="navbar-brand" href="">
                    <img src="{% static 'images/hospital-logo.png' %}" alt="logo" class="img-fluid app-logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-start navigation-menu" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title me-auto ms-auto" id="offcanvasNavbarLabel">
                            <img src="{% static 'images/hospital-logo.png' %}" alt="logo" class="img-fluid app-logo">
                        </h5>
                        <button type="button" class="btn-close btn-close-light" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav d-flex align-items-center mx-auto">
                            <li class="nav-item">
                                <a class="nav-link p-2 navigation-link" href="{% url 'home_page' %}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link p-2 navigation-link" href="">About</a>
                            </li>
                            <li class="nav-item create-event">
                                <a class="nav-link p-2 navigation-link" href="">Departments</a>
                            </li>
                            <li class="nav-item create-event">
                                <a class="nav-link p-2 navigation-link" href="">Doctors</a>
                            </li>
                            <li class="nav-item create-event">
                                <a class="nav-link p-2 navigation-link" href="">Contact</a>
                            </li>
                        </ul>

                        <ul class="navbar-nav d-flex align-items-center">
                            <li class="nav-item">
                                <a class="nav-link p-2 navigation-link" href="">Staff</a>
                            </li>
                            <li class="nav-item patient-login rounded me-2">
                                <a class="nav-link p-2 patient-link" href="">Patient Login</a>
                            </li>
                            <li class="nav-item book-appointment rounded">
                                <a class="nav-link p-2 book-link" href="">Book Appointment</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        {% block content %}
        {% endblock %}
